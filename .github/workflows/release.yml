# Tag v* → build macOS (universal), Windows x64 and Linux x64, zip each with the
# licence, README and example configs, and attach to a GitHub release.
#
# Modelled on oxbow's, which is the closest analogue in the fleet: a console app
# with a web control page, so a zip is the right shape until it grows a tray
# shell. Linux is included because Frame Ferret builds and self-tests there,
# where oxbow does not.
#
# What a downloaded build can and cannot do, which matters because it is not
# obvious from the filename: hosted runners have no NDI, OMT, DeckLink or SRT
# libraries, and every one of those is loaded at run time rather than linked —
# so a downloaded build reports each as unavailable until the operator installs
# it, rather than failing to start. DeckLink is the exception that is compiled
# out entirely, because its SDK is needed at build time and is not ours to
# redistribute.

name: release

on:
  push:
    tags:
      - "v*"
  # A dispatch from a branch is a dry run: everything builds and the artefacts
  # stay on the workflow run; the release job only runs for a tag.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          # Must be set at configure time, or "universal" ships arm64 only.
          if [[ "${{ matrix.name }}" == macos-* ]]; then
            EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      - name: Self test
        shell: bash
        run: |
          if [ -f build/frame-ferret ]; then
            ./build/frame-ferret selftest
          else
            ./build/Release/frame-ferret.exe selftest
          fi

      - name: Verify architectures (macOS)
        if: startsWith(matrix.name, 'macos')
        # Not `lipo … | grep -q`: Actions runs bash with `-o pipefail`, and a
        # `grep -q` that FINDS its match exits immediately, so lipo takes
        # SIGPIPE and the pipeline reports failure — failing the release on a
        # perfectly good universal binary. The match is also deliberately not
        # order-dependent; lipo makes no promise about the order it lists in.
        run: |
          __archs=$( lipo -archs build/frame-ferret )
          case "$__archs" in
            *x86_64*arm64*|*arm64*x86_64*) echo "universal: $__archs" ;;
            *) echo "expected a universal binary, got: $__archs"; exit 1 ;;
          esac

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}" ;; esac
          STAGE="frame-ferret-$VERSION-${{ matrix.name }}"
          mkdir "$STAGE"
          if [[ -f build/Release/frame-ferret.exe ]]; then
            cp build/Release/frame-ferret.exe "$STAGE/"
          else
            cp build/frame-ferret "$STAGE/"
          fi
          cp README.md LICENSE "$STAGE/"
          mkdir "$STAGE/config"
          cp config/*.json "$STAGE/config/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            zip -r "$STAGE.zip" "$STAGE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frame-ferret-${{ matrix.name }}
          path: frame-ferret-*.zip
          if-no-files-found: error

  # The desktop app: a tray launcher wrapping the same binary, which is what
  # most people actually want — a .app they can double-click, not a folder with
  # a terminal program in it. The zips above stay, because a CLI is still the
  # right shape for a headless machine.
  #
  # macOS is one universal build: prepare.sh compiles the engine for both
  # architectures (CMAKE_OSX_ARCHITECTURES, the same flag the build job uses),
  # Tauri builds both slices of the launcher and lipos them, and the gate below
  # reads every Mach-O in the bundle. It leaves here ad-hoc signed; the
  # Developer ID signature and notarisation are applied post-hoc by the
  # watcher on the author's Mac, like every other CI-built macOS asset in the
  # fleet. universal-apple-darwin is a Tauri bundling target and not a rustup
  # one, so `rust_targets` carries the two real triples.
  launcher:
    name: launcher-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macos,   target: universal-apple-darwin,   rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { os: windows-latest, name: windows, target: x86_64-pc-windows-msvc,   rust_targets: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest,  name: linux,   target: x86_64-unknown-linux-gnu, rust_targets: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Linux bundler dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Stage the binary
        shell: bash
        run: launcher/scripts/prepare.sh

      - name: Build the app
        working-directory: launcher
        shell: bash
        # --bundles app on macOS: the .dmg and .pkg come from the fleet's
        # release helper below, from the same staged bundle. Windows and Linux
        # take the bundles tauri.conf.json lists (nsis; deb + rpm).
        run: |
          npm ci
          if [[ "${{ matrix.name }}" == macos ]]; then
            npx --no-install tauri build --target ${{ matrix.target }} --bundles app
          else
            npm run tauri build
          fi

      # Proof that "universal" is universal, for EVERY Mach-O in the bundle: a
      # fat launcher around a thin engine launches on an Intel Mac and dies the
      # moment it starts the engine. Captured and matched with `case`, never
      # piped into grep — steps run as `bash -eo pipefail`, so a grep that exits
      # on its first match SIGPIPEs lipo and fails the step BECAUSE it matched.
      - name: Verify the macOS launcher is universal
        if: matrix.name == 'macos'
        shell: bash
        run: |
          appdir="launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="Frame Ferret.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }
          found=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            found=$((found+1))
            echo "${f#$appdir/$app/}: $__archs"
            case "$__archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "expected both slices in $f, got: $__archs" >&2; exit 1 ;;
            esac
          done < <(find "$appdir/$app" -type f -perm -u+x)
          # A find that matched nothing would pass every check above in silence.
          if [ "$found" -lt 2 ]; then
            echo "expected at least the app binary and the embedded engine, found $found" >&2
            exit 1
          fi

      - name: Installers (macOS)
        if: matrix.name == 'macos'
        shell: bash
        # Tauri has no pkg bundler and its dmg step drives Finder, which fails
        # headless, so both come from the fleet's release helper. Ad-hoc signed
        # here: an unsigned bundle is refused as "damaged".
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0-dev.${GITHUB_RUN_NUMBER}" ;; esac
          rl_init "Frame Ferret" frame-ferret "$version" com.stoatworks.frame-ferret "$GITHUB_WORKSPACE/out"
          appdir="launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="Frame Ferret.app"
          stage="$RUNNER_TEMP/stage-launcher"
          rm -rf "$stage"; mkdir -p "$stage" "$GITHUB_WORKSPACE/out"
          cp -R "$appdir/$app" "$stage/"
          rl_adhoc_sign "$stage/$app"
          rl_dmg macos-universal "$stage" --app "$app"
          rl_pkg macos-universal "$stage" --app "$app"

      - name: Collect launcher bundles
        shell: bash
        run: |
          mkdir -p out
          find launcher/src-tauri/target -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -path '*/release/bundle/*' -exec cp {} out/ \; 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: frame-ferret-launcher-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [build, launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Published, not drafted. This used to say `draft: true` on the theory that
      # the fleet's auto-signer would re-sign the macOS artefact "after the
      # release appears" -- but auto-sign-watch.sh reads each repo's *latest
      # published* release, so a draft never appears to it at all. The
      # 2026-09-04 tag sat as an unsigned, unpublished draft for ten days
      # because of this; v0.2.2 was published by hand on 2026-09-14.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Recursive globs, not root-level ones. upload-artifact keeps the
          # directory structure below the common root, so the launcher's
          # bundles arrive as dmg/*.dmg, nsis/*.exe and so on — `*.dmg` at the
          # top matches nothing, and action-gh-release treats "no match" as
          # nothing to attach rather than as an error. v0.1.1 first went out
          # with only the three zips because of exactly this.
          files: |
            frame-ferret-*.zip
            **/*.dmg
            **/*.pkg
            **/*.exe
            **/*.deb
            **/*.rpm
